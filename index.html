<!DOCTYPE html>
<html>
<head>
<title>Aula de Formulário</title>
<link rel="stylesheet" href="style/index.css">
</head>
<body>
<form>

<label for="nome">Nome</label>
<input type="text" id="nome" name="nome"required placeholder="Ex:Isabelle Guedes"/>

<label for="email">Email</label>
<input type="email" id="email" name="email" required placeholder="email@exemplo.com">

<label for="">Telefone</label>
<input type="tel" name="Telefone" id="Telefone" required placeholder="(XX) XXXXX-XXXX" pattern="\(\d{2}\) \d{5}-\d{4}">

<label for=""> Data de Nascimento</label>
<input type="date" name="DataNascimento" id="DataNascimento" required/>

<label for="senha">Senha</label>
<input type="password" name="senha" id="senha" required placeholder="Digite sua senha"/>

<button type="submit" style="width: 90%; padding: 10px; cursor: pointer;">Enviar</button>

</body> 
</html>
